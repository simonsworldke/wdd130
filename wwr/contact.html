                <figure>
                    <img src="images/employee1.jpg" alt="James - Lead Rafting Guide">
                    <figcaption>James - Lead Rafting Guide</figcaption>

                <figure>

        <section class="map">
            <h2>Find Us Here</h2>

                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.650051824631!2d35.26978097363918!3d0.5222976994644428!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1781018ef9b73cd7%3A0x4ab94c7a8f523868!2sRiver%20Bank%20Rd%2C%20Eldoret!5e0!3m2!1sen!2ske!4v1692000000000!5m2!1sen!2ske"

                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
        </section>


        <section class="contact-form">
            <h2>Send us a Message</h2>
            <form action="submit_form.php" method="post">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label><input type="radio" name="purpose" value="general" required> General Inquiry</label><br>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label><br>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label>
                    <input type="checkbox" name="subscribe" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </section>
    </main>
